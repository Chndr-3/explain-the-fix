<svg viewBox="0 0 795.8 197.8" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Example causal chain diagram: trigger leads to cause leads to fix, resolved">
  <defs>
    <marker id="ex-arrow" viewBox="0 0 9.2 9.2" refX="8.05" refY="4.6" markerWidth="8.05" markerHeight="8.05" orient="auto">
      <path d="M0.57 0.92 L8.05 4.6 L0.57 8.28" fill="none" stroke="#333d4b" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="795.8" height="197.8" rx="16.1" fill="#141922" stroke="#242c37"/>

  <text x="23" y="29.9" font-family="Trebuchet MS, sans-serif" font-size="9.5" letter-spacing="1.5" fill="#8b95a4">01 · TRIGGER</text>
  <rect x="23" y="41.4" width="207" height="89.7" rx="10.35" fill="#1a2029" stroke="#333d4b"/>
  <text x="43.7" y="78.2" font-family="Trebuchet MS, sans-serif" font-size="13.5" font-weight="600" fill="#e4e7ec">Retry on 429</text>
  <text x="43.7" y="103.5" font-family="ui-monospace, monospace" font-size="11" fill="#8b95a4">fetchQueue.ts:114</text>

  <circle cx="234.6" cy="86.25" r="2.3" fill="#333d4b"/>
  <path d="M241.5 86.25 H282.9" stroke="#333d4b" stroke-width="1.25" fill="none" marker-end="url(#ex-arrow)"/>

  <text x="294.4" y="29.9" font-family="Trebuchet MS, sans-serif" font-size="9.5" letter-spacing="1.5" fill="#8b95a4">02 · CAUSE</text>
  <rect x="294.4" y="41.4" width="207" height="89.7" rx="10.35" fill="#1a2029" stroke="#333d4b"/>
  <text x="315.1" y="78.2" font-family="Trebuchet MS, sans-serif" font-size="13.5" font-weight="600" fill="#e4e7ec">Backoff never reset</text>
  <text x="315.1" y="103.5" font-family="ui-monospace, monospace" font-size="11" fill="#8b95a4">delay *= 2 in loop</text>

  <circle cx="506" cy="86.25" r="2.3" fill="#333d4b"/>
  <path d="M512.9 86.25 H554.3" stroke="#333d4b" stroke-width="1.25" fill="none" marker-end="url(#ex-arrow)"/>

  <text x="565.8" y="29.9" font-family="Trebuchet MS, sans-serif" font-size="9.5" letter-spacing="1.5" fill="#f5a524">03 · RESOLVED</text>
  <rect x="565.8" y="41.4" width="207" height="89.7" rx="10.35" fill="rgba(245,165,36,.13)" stroke="#f5a524" stroke-width="1.25"/>
  <path d="M740.6 59.8 l5.17 5.17 L755.55 55.2" stroke="#f5a524" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <text x="586.5" y="78.2" font-family="Trebuchet MS, sans-serif" font-size="13.5" font-weight="600" fill="#f5a524">Reset on success</text>
  <text x="586.5" y="103.5" font-family="ui-monospace, monospace" font-size="11" fill="#8b95a4">delay = BASE</text>

  <text x="23" y="172.5" font-family="Trebuchet MS, sans-serif" font-size="12.5" fill="#8b95a4">The retry loop kept doubling delay because success never reset it back to base.</text>
</svg>
