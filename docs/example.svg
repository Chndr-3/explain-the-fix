<svg viewBox="0 0 692 172" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Example causal chain diagram: trigger leads to cause leads to fix, resolved">
  <defs>
    <marker id="ex-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0.5 0.8 L7 4 L0.5 7.2" fill="none" stroke="#333d4b" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="692" height="172" rx="14" fill="#141922" stroke="#242c37"/>

  <text x="20" y="26" font-family="Trebuchet MS, sans-serif" font-size="9.5" letter-spacing="1.5" fill="#8b95a4">01 · TRIGGER</text>
  <rect x="20" y="36" width="180" height="78" rx="9" fill="#1a2029" stroke="#333d4b"/>
  <text x="38" y="68" font-family="Trebuchet MS, sans-serif" font-size="13.5" font-weight="600" fill="#e4e7ec">Retry on 429</text>
  <text x="38" y="90" font-family="ui-monospace, monospace" font-size="11" fill="#8b95a4">fetchQueue.ts:114</text>

  <circle cx="204" cy="75" r="2" fill="#333d4b"/>
  <path d="M210 75 H246" stroke="#333d4b" stroke-width="1.25" fill="none" marker-end="url(#ex-arrow)"/>

  <text x="256" y="26" font-family="Trebuchet MS, sans-serif" font-size="9.5" letter-spacing="1.5" fill="#8b95a4">02 · CAUSE</text>
  <rect x="256" y="36" width="180" height="78" rx="9" fill="#1a2029" stroke="#333d4b"/>
  <text x="274" y="68" font-family="Trebuchet MS, sans-serif" font-size="13.5" font-weight="600" fill="#e4e7ec">Backoff never reset</text>
  <text x="274" y="90" font-family="ui-monospace, monospace" font-size="11" fill="#8b95a4">delay *= 2 in loop</text>

  <circle cx="440" cy="75" r="2" fill="#333d4b"/>
  <path d="M446 75 H482" stroke="#333d4b" stroke-width="1.25" fill="none" marker-end="url(#ex-arrow)"/>

  <text x="492" y="26" font-family="Trebuchet MS, sans-serif" font-size="9.5" letter-spacing="1.5" fill="#f5a524">03 · RESOLVED</text>
  <rect x="492" y="36" width="180" height="78" rx="9" fill="rgba(245,165,36,.13)" stroke="#f5a524" stroke-width="1.25"/>
  <path d="M644 52 l4.5 4.5 L657 48" stroke="#f5a524" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <text x="510" y="68" font-family="Trebuchet MS, sans-serif" font-size="13.5" font-weight="600" fill="#f5a524">Reset on success</text>
  <text x="510" y="90" font-family="ui-monospace, monospace" font-size="11" fill="#8b95a4">delay = BASE</text>

  <text x="20" y="150" font-family="Trebuchet MS, sans-serif" font-size="12.5" fill="#8b95a4">The retry loop kept doubling delay because success never reset it back to base.</text>
</svg>
