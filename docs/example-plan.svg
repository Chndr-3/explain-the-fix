<svg viewBox="0 0 692 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Example linear-steps plan diagram: step one leads to step two leads to the plan's goal, not yet started">
  <defs>
    <marker id="ex-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0.5 0.8 L7 4 L0.5 7.2" fill="none" stroke="#333d4b" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="692" height="180" rx="14" fill="#141922" stroke="#242c37"/>

  <text x="20" y="26" font-family="Trebuchet MS, sans-serif" font-size="9.5" letter-spacing="1.5" fill="#8b95a4">01 · STEP</text>
  <rect x="20" y="36" width="180" height="94" rx="9" fill="#1a2029" stroke="#333d4b"/>
  <text x="38" y="68" font-family="Trebuchet MS, sans-serif" font-size="13.5" font-weight="600" fill="#e4e7ec">Add unlock action</text>
  <text x="38" y="90" font-family="ui-monospace, monospace" font-size="11" fill="#8b95a4">campaign/actions.ts</text>

  <circle cx="204" cy="75" r="2" fill="#333d4b"/>
  <path d="M210 75 H246" stroke="#333d4b" stroke-width="1.25" fill="none" marker-end="url(#ex-arrow)"/>

  <text x="256" y="26" font-family="Trebuchet MS, sans-serif" font-size="9.5" letter-spacing="1.5" fill="#8b95a4">02 · STEP</text>
  <rect x="256" y="36" width="180" height="94" rx="9" fill="#1a2029" stroke="#333d4b"/>
  <text x="274" y="68" font-family="Trebuchet MS, sans-serif" font-size="13.5" font-weight="600" fill="#e4e7ec">Register on route</text>
  <text x="274" y="90" font-family="ui-monospace, monospace" font-size="11" fill="#8b95a4">campaign/route.ts</text>

  <circle cx="440" cy="75" r="2" fill="#333d4b"/>
  <path d="M446 75 H482" stroke="#333d4b" stroke-width="1.25" fill="none" marker-end="url(#ex-arrow)"/>

  <text x="492" y="26" font-family="Trebuchet MS, sans-serif" font-size="9.5" letter-spacing="1.5" fill="#f5a524">03 · GOAL</text>
  <rect x="492" y="36" width="180" height="94" rx="9" fill="none" stroke="#f5a524" stroke-width="1.25" stroke-dasharray="4 4"/>
  <circle cx="657" cy="52" r="7" fill="none" stroke="#f5a524" stroke-width="1.5"/>
  <circle cx="657" cy="52" r="3" fill="none" stroke="#f5a524" stroke-width="1.5"/>
  <circle cx="657" cy="52" r="1" fill="#f5a524"/>
  <text font-family="Trebuchet MS, sans-serif" font-size="13.5" font-weight="600" fill="#f5a524">
    <tspan x="510" y="66">Gate re-renders</tspan>
    <tspan x="510" y="82">unlocked</tspan>
  </text>
  <text x="510" y="104" font-family="ui-monospace, monospace" font-size="11" fill="#8b95a4">PrivateCampaignGate.tsx</text>

  <text x="20" y="158" font-family="Trebuchet MS, sans-serif" font-size="12.5" fill="#8b95a4">Three steps, all in the campaign module — nothing here is built yet.</text>
</svg>
