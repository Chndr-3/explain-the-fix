      <path d="M0.5 0.8 L7 4 L0.5 7.2" fill="none" stroke="#333d4b" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="692" height="180" rx="14" fill="#141922" stroke="#242c37"/>

  <text x="20" y="26" font-family="Trebuchet MS, sans-serif" font-size="9.5" letter-spacing="1.5" fill="#8b95a4">01 · SYMPTOM</text>
  <rect x="20" y="36" width="180" height="94" rx="9" fill="#1a2029" stroke="#333d4b"/>
  <text x="38" y="68" font-family="Trebuchet MS, sans-serif" font-size="13.5" font-weight="600" fill="#e4e7ec">Totals drift on refresh</text>
  <text x="38" y="90" font-family="ui-monospace, monospace" font-size="11" fill="#8b95a4">ReportTotals.tsx</text>

  <circle cx="204" cy="75" r="2" fill="#333d4b"/>
  <path d="M210 75 H246" stroke="#333d4b" stroke-width="1.25" fill="none" marker-end="url(#ex-arrow)"/>

  <text x="256" y="26" font-family="Trebuchet MS, sans-serif" font-size="9.5" letter-spacing="1.5" fill="#8b95a4">02 · FACTOR</text>
  <rect x="256" y="36" width="180" height="94" rx="9" fill="#1a2029" stroke="#333d4b"/>
  <text x="274" y="68" font-family="Trebuchet MS, sans-serif" font-size="13.5" font-weight="600" fill="#e4e7ec">Memo keyed on filters</text>
  <text x="274" y="90" font-family="ui-monospace, monospace" font-size="11" fill="#8b95a4">not filters + page</text>

  <circle cx="440" cy="75" r="2" fill="#333d4b"/>
  <path d="M446 75 H482" stroke="#333d4b" stroke-width="1.25" fill="none" marker-end="url(#ex-arrow)"/>

  <text x="492" y="26" font-family="Trebuchet MS, sans-serif" font-size="9.5" letter-spacing="1.5" fill="#f5a524">03 · ROOT CAUSE</text>
  <rect x="492" y="36" width="180" height="94" rx="9" fill="none" stroke="#f5a524" stroke-width="1.5"/>
  <path d="M657 45 L665 58 L649 58 Z" fill="none" stroke="#f5a524" stroke-width="1.4" stroke-linejoin="round"/>
  <line x1="657" y1="49.5" x2="657" y2="53.5" stroke="#f5a524" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="657" cy="55.5" r="0.9" fill="#f5a524"/>
  <text x="510" y="68" font-family="Trebuchet MS, sans-serif" font-size="13.5" font-weight="600" fill="#f5a524">Stale page total reused</text>
  <text x="510" y="90" font-family="ui-monospace, monospace" font-size="11" fill="#8b95a4">after paging back</text>

  <text x="20" y="158" font-family="Trebuchet MS, sans-serif" font-size="12.5" fill="#8b95a4">Confirmed: memo key is missing "page." Haven't touched the fix yet.</text>
