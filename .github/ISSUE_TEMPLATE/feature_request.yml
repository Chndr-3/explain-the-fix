name: Feature request
description: A new diagram shape, a rendering improvement, or a workflow change.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What's missing or awkward today
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like instead
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This fits the "glanceable, not documentation" goal (8 nodes max, one diagram per explanation)
